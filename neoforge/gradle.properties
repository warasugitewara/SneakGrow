# NOTE: Gradle reads this file as ISO-8859-1, so keep every value ASCII-only.
#       Non-ASCII text (e.g. the Japanese mod description) lives in
#       src/main/templates/META-INF/neoforge.mods.toml instead.
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
org.gradle.parallel=true
org.gradle.caching=true
kotlin.code.style=official

# Environment Properties
# https://projects.neoforged.net/neoforged/neoforge
minecraft_version=1.21.1
minecraft_version_range=[1.21.1,1.22)
neo_version=21.1.248
neo_version_range=[21.1.0,)

# Kotlin for Forge (bundled with ATM10). Only the 5.x line targets 1.21.1;
# 6.x is for 1.21.10+ and must not be used here.
kff_version=5.5.0
kff_version_range=[5,)
# Version range of the FML language loader (kotlinforforge)
loader_version_range=[5,)

# https://parchmentmc.org/docs/getting-started
parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17

## Mod Properties
mod_id=sneakgrow
mod_name=SneakGrow
mod_license=MIT
mod_version=1.6
mod_group_id=net.teamfruit.sneakgrow
mod_authors=Kamesuta, warasugitewara
