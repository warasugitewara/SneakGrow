name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create (e.g. v1.7)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Paper 版は JDK 25、NeoForge 版は JDK 21 が必要。
      # 複数指定した場合 JAVA_HOME は最後の 25 を指すので、
      # Gradle 側だけ JAVA_HOME_21_X64 を明示して切り替える。
      - name: Set up JDK 21 and 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            21
            25
          cache: maven

      - name: Build Paper plugin with Maven
        run: mvn -B -ntp package

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build NeoForge mod with Gradle
        working-directory: neoforge
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_21_X64 }}
        run: ./gradlew build

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          files: |
            target/sneakgrow-*.jar
            neoforge/build/libs/sneakgrow-neoforge-*.jar
          generate_release_notes: true
