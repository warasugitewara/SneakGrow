name: Release

on:
  push:
    tags:
      # v1.7 のような 2 桁表記も拾えるようにする。
      # 以前は "v*.*.*" だったが、このリポジトリのタグは vX.Y 形式のため
      # 一度も一致せず、リリースは常に workflow_dispatch 頼みになっていた。
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create (e.g. v1.7)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Paper 版は JDK 25、NeoForge 版は JDK 21 が必要。
      # 複数指定した場合 JAVA_HOME は最後の 25 を指すので、
      # Gradle 側だけ JAVA_HOME_21_X64 を明示して切り替える。
      - name: Set up JDK 21 and 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            21
            25
          cache: maven

      - name: Build Paper plugin with Maven
        run: mvn -B -ntp package

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build NeoForge mod with Gradle
        working-directory: neoforge
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_21_X64 }}
        run: ./gradlew build

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          files: |
            target/sneakgrow-*.jar
            neoforge/build/libs/sneakgrow-neoforge-*.jar
          generate_release_notes: true

      # Modrinth 公開。Paper 版と NeoForge 版は対象 MC バージョンが異なるため
      # 別ステップに分ける。github-token を渡していないのは、前段の
      # action-gh-release と二重に GitHub Release を作らせないため。
      - name: Publish Paper plugin to Modrinth
        uses: Kira-NT/mc-publish@52307b03863581dec6b652b83e597aec02ebb075 # v3.3.1
        with:
          modrinth-id: sneakgr0w
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          files: target/sneakgrow-*.jar
          name: SneakGrow ${{ github.event.inputs.tag || github.ref_name }} (Paper)
          version: ${{ github.event.inputs.tag || github.ref_name }}+paper
          version-type: release
          loaders: paper
          game-versions: "26.1.2"
          java: 25

      - name: Publish NeoForge mod to Modrinth
        uses: Kira-NT/mc-publish@52307b03863581dec6b652b83e597aec02ebb075 # v3.3.1
        with:
          modrinth-id: sneakgr0w
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          files: neoforge/build/libs/sneakgrow-neoforge-*.jar
          name: SneakGrow ${{ github.event.inputs.tag || github.ref_name }} (NeoForge)
          version: ${{ github.event.inputs.tag || github.ref_name }}+neoforge
          version-type: release
          loaders: neoforge
          game-versions: "1.21.1"
          java: 21
